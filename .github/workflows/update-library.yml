name: 每日更新工具资料

on:
  schedule:
    # 22:17 UTC = 次日北京时间 06:17，避开整点。
    - cron: '17 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-library.yml'
      - 'config/**'
      - 'scripts/update_upstream.py'
      - 'scripts/build_catalog.py'
      - 'scripts/free_proxy_sources.py'
      - 'scripts/build_free_proxy_pages.py'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/update-library.yml'
      - 'config/**'
      - 'scripts/update_upstream.py'
      - 'scripts/build_catalog.py'
      - 'scripts/free_proxy_sources.py'
      - 'scripts/build_free_proxy_pages.py'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: knowledge-library-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  verify:
    name: 校验更新逻辑
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 读取仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 准备 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: 运行离线测试
        run: python -m unittest discover -s tests -v
      - name: 校验来源映射并生成目录
        run: python scripts/build_catalog.py

  update:
    name: 检查上游并发布目录
    needs: verify
    if: github.repository == 'mtmpss/Fanqiang-Guide' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: 读取已校验的提交
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: 准备 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: 检查公开 GitHub 项目
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_upstream.py
      - name: 生成可阅读目录和检查报告
        run: python scripts/build_catalog.py
      - name: 收集公开节点订阅与代理来源
        run: python scripts/free_proxy_sources.py
      - name: 生成每日资料页与日期目录
        run: python scripts/build_free_proxy_pages.py
      - name: 发布本次检查结果
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/upstream.json CATALOG.md UPDATES.md data/free-proxy-sources.json free-proxies/
          if git diff --cached --quiet; then
            echo '内容未变化，无需提交。'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              -c commit.gpgSign=false \
              commit -m '更新工具版本与每日免费代理资料'
          git push origin HEAD:main
